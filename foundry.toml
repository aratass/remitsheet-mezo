[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "contracts/out"
cache_path = "contracts/cache"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 20000
# Deterministic bytecode: no metadata hash or CBOR suffix, so the CREATE2 address
# depends only on the contract code and these compiler settings.
bytecode_hash = "none"
cbor_metadata = false

[fuzz]
runs = 1000

[profile.ci.fuzz]
runs = 10000

[lint]
# Tests build byte32 references from short string literals on purpose.
ignore = ["contracts/test/**/*.sol"]
